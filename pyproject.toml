[project]
name = "data-assistant"
version = "0.1.0"
description = "Assistente virtual de dados com SQLite, LangGraph e Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "editables>=0.5",
    "kaleido>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "plotly>=6.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.1.0",
    "sqlglot>=26.0.0",
    "streamlit>=1.45.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_assistant"]

[tool.hatch.build]
dev-mode-exact = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "llm: testes que fazem chamadas reais ao OpenRouter",
    "integration: testes que dependem do anexo SQLite local",
    "png: testes de exportação estática que dependem de Chrome/Chromium local",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["plotly.*"]
ignore_missing_imports = true
