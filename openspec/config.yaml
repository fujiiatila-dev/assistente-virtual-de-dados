schema: spec-driven

context: |
  Projeto: Assistente Virtual de Dados — desafio técnico de Engenharia de IA (nível Pleno).
  Repositório de implementação: assistente-virtual-dados-desafio-1/ (root Git do projeto,
  criado dentro do workspace de planejamento).
  Objetivo: agente que responde perguntas de negócio em linguagem natural consultando um
  banco SQLite fornecido no desafio (anexo_desafio_1.db), com descoberta dinâmica de
  schema, auto-correção de SQL e visualização apropriada, num frontend Streamlit com
  transparência das etapas executadas.

  Tech stack: Python 3.11+, LangGraph (orquestração), LangChain (abstrações de LLM),
  SQLite (dados), Streamlit (frontend), uv (gerenciamento de dependências), pytest.

  LLM: acesso via OpenRouter (API compatível com OpenAI) com modelos da família Google
  (gemini-2.5-flash padrão); troca de modelo por env var OPENROUTER_MODEL sem mudar código.
  Chaves via variáveis de ambiente (OPENROUTER_API_KEY); NUNCA commitar segredos.

  Banco de dados: somente leitura (modo URI file:...?mode=ro). O anexo local de referência
  é ../anexo_desafio_1.db durante o desenvolvimento local; o caminho é configurável para
  também aceitar clientes_completo.db
  ou outro SQLite compatível. O anexo possui as quatro tabelas do enunciado e pode conter
  colunas extras. O schema deve ser descoberto em tempo de execução via sqlite_master e
  PRAGMA; queries hardcoded contra o schema são proibidas.

  Idioma: documentação e README em português (README com versão em inglês); código,
  identificadores e commits em inglês.

  Conventions: conventional commits; type hints em todo o código público; pytest para testes.

  Domínio: varejo — clientes, compras, suporte e campanhas de marketing.

rules:
  specs:
    - Use Given/When/Then format for scenarios
    - Each spec SHALL reference RFC 2119 keywords (MUST/SHOULD/MAY) em português ou inglês
  design:
    - Include sequence diagrams (mermaid) for complex async flows
    - Cada decisão relevante SHALL referenciar um ADR em docs/adr/
  tasks:
    - Break tasks into chunks of max 2 hours
    - Cada task SHALL ser verificável por comando (pytest, lint ou script)
