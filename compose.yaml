services:
  app:
    image: ${APP_IMAGE:-data-assistant:local}
    build: .
    env_file:
      - .env
    environment:
      DB_PATH: /data/source.sqlite3
      QUOTA_DB_PATH: /app/runtime/quota.sqlite3
      BROWSER_PATH: /usr/bin/chromium
    volumes:
      - type: bind
        source: ${HOST_DB_PATH:-../anexo_desafio_1.db}
        target: /data/source.sqlite3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RUNTIME_DIR:-./runtime}
        target: /app/runtime
    ports:
      - "127.0.0.1:8501:8501"
    networks:
      - assistant_net
    restart: unless-stopped

  cloudflared:
    profiles:
      - public
    image: cloudflare/cloudflared:2026.9.1
    command: tunnel --no-autoupdate run
    env_file:
      - path: ./runtime/tunnel.env
        required: false
    environment:
      TUNNEL_LOGLEVEL: warn
    depends_on:
      app:
        condition: service_healthy
    network_mode: host
    restart: unless-stopped

networks:
  assistant_net: {}
